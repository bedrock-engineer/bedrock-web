<svg viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" style="isolation: isolate;">
  <defs>
        <mask id="holes">
            <rect width="100%" height="100%" fill="white"/>
            <circle cx="11.1" cy="6.0" r="0.55" fill="black"/>
            <circle cx="10.3" cy="8.8" r="0.3" fill="black"/>
            <circle cx="8.6" cy="4.8" r="0.2" fill="black"/>
        </mask>
    </defs>
  
  <!-- Sun rays on the left side only -->
  <!-- Top ray -->
  <line x1="7.5" y1="0.5" x2="7.5" y2="2.2" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <!-- Bottom ray -->
  <line x1="7.5" y1="12.8" x2="7.5" y2="14.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <!-- Left ray -->
  <line x1="0.5" y1="7.5" x2="2.2" y2="7.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <!-- Top-left ray -->
  <line x1="2.2" y1="2.2" x2="3.4" y2="3.4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <!-- Bottom-left ray -->
  <line x1="2.2" y1="12.8" x2="3.4" y2="11.6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>

  <!-- Full circle outline -->
  <circle cx="7.5" cy="7.5" r="3.8" stroke="currentColor" stroke-width="1" fill="none" mask="url(#holes)" />

  <!-- Dark right half of the circle -->
  <path 
    d="M7.5 3.7 A3.8 3.8 0 0 1 7.5 11.3 Z"
    fill="currentColor"
    mask="url(#holes)"
  />

  <!-- Letter 'a' centered -->
  <text x="50%" y="9.2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="600" fill="currentColor" style="mix-blend-mode:difference;">
    A
  </text>
</svg>
