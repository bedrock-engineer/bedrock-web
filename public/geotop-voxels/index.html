      {
        "@context": "https://schema.org",

        "name": "GeoTOP 3D Tiles Voxels — Bedrock.engineer",
        "description": "Explore the Dutch GeoTOP geological model in 3D directly in your browser, using CesiumJS and the 3D Tiles Voxel extension.",

      }

    <title>GeoTOP as 3DTiles Voxels — Bedrock</title>
    <style>
      html {
        height: 100%;
      }

      * {
        margin: 0;
      }

      body {
        margin: 0;
        font-family: sans-serif;
        font-size: 12px;
        height: 100%;
      }

      #map {
        height: 100%;
      }

      .panel {
        position: absolute;
        background: oklch(100% 0.00011 271.152 / 0.9);
        border-radius: 2px;
        padding: 10px;
        box-shadow: 0 2px 4px oklch(0% 0 0 / 0.2);
        z-index: 10;
      }

      #controls {
        top: 10px;
        left: 10px;
        max-width: 200px;
      }

      h2 {
        margin-block-end: 8px;
      }

      .legend-item {
        display: grid;
        grid-template-columns: auto auto 1fr;
        align-items: center;
        column-gap: 6px;
        margin-bottom: 2px;
        text-transform: capitalize;
      }

      .legend-item input[type="checkbox"] {
        margin: 0;
        cursor: pointer;
      }

      .legend-item.hidden {
        opacity: 0.5;
      }

      .legend-item.hidden .legend-rect {
        background: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.2) 2px,
          rgba(0, 0, 0, 0.2) 4px
        ) !important;
      }

      .legend-rect {
        width: 25px;
        aspect-ratio: 1;
        border: 1px solid oklch(62.341% 0.00007 271.152);
      }

      .radio-item {
        display: flex;
        column-gap: 4px;
        align-items: center;
        margin-bottom: 6px;
        cursor: pointer;
      }

      .radio-item input[type="checkbox"] {
        margin-right: 8px;
        cursor: pointer;
      }

      .radio-item label {
        cursor: pointer;
        user-select: none;
      }

      .checkbox-option {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 8px 0;
        cursor: pointer;
      }

      .checkbox-option input {
        margin: 0;
        cursor: pointer;
      }

      .clipping-controls {
        margin: 12px 0;
        padding-top: 8px;
        border-top: 1px solid oklch(80% 0 0);
      }

      .clipping-controls h3 {
        font-size: 12px;
        margin: 0 0 8px 0;
      }

      .clipping-controls label {
        display: grid;
        grid-template-columns: 40px 1fr;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 11px;
      }

      .clipping-controls input[type="range"] {
        width: 100%;
      }

      .clipping-controls button {
        margin-top: 6px;
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
      }

      @media (max-width: 500px) {
        .legend-rect {
          width: 10px;
        }

        #controls {
          top: unset;
          left: 0px;
          bottom: 0px;
          max-width: 100%;
        }
      }

      .panel-toggle {
        position: absolute;
        bottom: 10px;
        left: 10px;
        z-index: 11;
        background: oklch(100% 0.00011 271.152 / 0.9);
        border: none;
        border-radius: 4px;
        font-size: 20px;
        padding: 6px 10px;
        cursor: pointer;
        box-shadow: 0 2px 4px oklch(0% 0 0 / 0.2);
        display: none;
      }

      @media (max-width: 500px) {
        .panel-toggle {
          display: block;
        }

        #controls {
          bottom: 0;
          left: 0;
          max-width: 100%;
          transform: translateY(100%);
          transition: transform 150ms ease-out;
        }

        #controls[data-open="true"] {
          transition: transform 100ms ease-in;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="script.js" type="module"></script>

    <button id="toggle-controls" class="panel-toggle">☰</button>

    <div id="controls" class="panel">
      <h2>GeoTOP 3DTiles Voxel</h2>
      <p>
        <a href="https://bedrock.engineer/" style="font-size: 10px">Bedrock</a>
      </p>

      <label>
        <span style="display: block">Basemap opacity</span>
        <input
          id="alpha"
          type="range"
          min="0.0"
          max="1.0"
          step="0.05"
          value="0.7"
        />
      </label>

      <label class="checkbox-option">
        <input type="checkbox" id="show-bounds" />
        <span>Show bounding box</span>
      </label>

      <label class="checkbox-option">
        <input type="checkbox" id="show-edges" />
        <span>Show voxel edges</span>
      </label>
<!-- 
      <div class="z-controls">
        <label>
          <span>Vertical exaggeration</span>
          <input
            type="range"
            id="vertical-exaggeration"
            min="1"
            max="100"
            step="1"
            value="1"
          />
        </label>
      </div> -->

      <div class="clipping-controls">
        <h3>Clipping</h3>

        <label>
          <span>X min</span>
          <input
            type="range"
            id="clip-x-min"
            min="0"
            max="1"
            step="0.01"
            value="0"
          />
        </label>

        <label>
          <span>X max</span>
          <input
            type="range"
            id="clip-x-max"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
        </label>

        <label>
          <span>Y min</span>
          <input
            type="range"
            id="clip-y-min"
            min="0"
            max="1"
            step="0.01"
            value="0"
          />
        </label>

        <label>
          <span>Y max</span>
          <input
            type="range"
            id="clip-y-max"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
        </label>

        <label>
          <span>Z min</span>
          <input
            type="range"
            id="clip-z-min"
            min="0"
            max="1"
            step="0.01"
            value="0"
          />
        </label>

        <label>
          <span>Z max</span>
          <input
            type="range"
            id="clip-z-max"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
        </label>

        <button id="reset-clipping" type="button">Reset</button>
      </div>

      <div id="datasets">
        <h2>Datasets</h2>
      </div>

      <div id="legend">
        <h2>Legenda</h2>

        <div class="legend-item" data-class="0">
          <input type="checkbox" checked id="class-0" />
          <div class="legend-rect" style="background: rgb(200, 200, 200)"></div>
          <label for="class-0">antropogeen</label>
        </div>

        <div class="legend-item" data-class="1">
          <input type="checkbox" checked id="class-1" />
          <div class="legend-rect" style="background: rgb(157, 78, 64)"></div>
          <label for="class-1">organisch materiaal (veen)</label>
        </div>

        <div class="legend-item" data-class="2">
          <input type="checkbox" checked id="class-2" />
          <div class="legend-rect" style="background: rgb(0, 146, 0)"></div>
          <label for="class-2">klei</label>
        </div>

        <div class="legend-item" data-class="3">
          <input type="checkbox" checked id="class-3" />
          <div class="legend-rect" style="background: rgb(194, 207, 92)"></div>
          <label for="class-3">kleiig zand, zandige klei en leem</label>
        </div>

        <div class="legend-item" data-class="4">
          <input type="checkbox" checked id="class-4" />
          <div class="legend-rect" style="background: rgb(243, 225, 6)"></div>
          <label for="class-4">zand niet gedifferentieerd</label>
        </div>

        <div class="legend-item" data-class="5">
          <input type="checkbox" checked id="class-5" />
          <div class="legend-rect" style="background: rgb(255, 255, 0)"></div>
          <label for="class-5">zand fijn</label>
        </div>

        <div class="legend-item" data-class="6">
          <input type="checkbox" checked id="class-6" />
          <div class="legend-rect" style="background: rgb(243, 225, 6)"></div>
          <label for="class-6">zand midden</label>
        </div>

        <div class="legend-item" data-class="7">
          <input type="checkbox" checked id="class-7" />
          <div class="legend-rect" style="background: rgb(231, 195, 22)"></div>
          <label for="class-7">zand grof</label>
        </div>

        <div class="legend-item" data-class="8">
          <input type="checkbox" checked id="class-8" />
          <div class="legend-rect" style="background: rgb(216, 163, 32)"></div>
          <label for="class-8">grind</label>
        </div>

        <div class="legend-item" data-class="9">
          <input type="checkbox" checked id="class-9" />
          <div class="legend-rect" style="background: rgb(95, 95, 255)"></div>
          <label for="class-9">schelpen</label>
        </div>

        <div class="legend-item" data-class="10">
          <input type="checkbox" checked id="class-10" />
          <div class="legend-rect" style="background: rgb(144, 144, 144)"></div>
          <label for="class-10">overig</label>
        </div>
      </div>

      <p style="font-size: 10px">
        <a
          href="https://basisregistratieondergrond.nl/inhoud-bro/registratieobjecten/modellen/geotop-gtm/"
        >
          GeoTOP
        </a>
        Basisregistratie Ondergrond (BRO), TNO (Geologische Dienst Nederland).
      </p>
    </div>
  </body>
</html>
